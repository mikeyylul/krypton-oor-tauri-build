name: Publish verified Windows download

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v74-download.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified Version 74.1 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 34998759871 --repo "$GITHUB_REPOSITORY" --name Krypton-OOR-Tauri-v74.2-Windows11-x64 --dir release
          test -s release/Krypton-OOR-Tauri-v74.2-Windows11-x64.zip

      - name: Publish stable direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v74.2.0 release/Krypton-OOR-Tauri-v74.2-Windows11-x64.zip --repo "$GITHUB_REPOSITORY" --target f46966b9e416bc7b7b2646f4f72278467eaf7a12 --title "Krypton OOR Windows v74.2.0" --notes "Verified Windows 11 x64 package built from Version 69 with the requested Version 70–74 changes. Extract this ZIP to access the Installer and Portable folders. The Shortage List Report button appears in Overview beneath the summary cards."
